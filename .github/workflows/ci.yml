name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip build pytest
      - name: Install immutable compatible GamerHQ Skill SDK
        run: python -m pip install "https://github.com/Duy-Phan96/GamerHQ/archive/bfe87ced8d44243aa31cc212ba5f8f287e21814e.zip"
      - name: Build package
        run: python -m build
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Dependency check
        run: python -m pip check
      - name: Test
        run: python -m pytest -q
