name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Install immutable compatible GamerHQ Skill SDK
        run: python -m pip install "https://github.com/Duy-Phan96/GamerHQ/archive/bfe87ced8d44243aa31cc212ba5f8f287e21814e.zip"
      - name: Build package
        run: python -m build
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Dependency check
        run: python -m pip check
      - name: Verify installed entry point
        run: |
          python - <<'PY'
          from importlib import metadata
          eps = [ep for ep in metadata.entry_points(group="gamerhq.skills") if ep.name == "progression"]
          assert len(eps) == 1, eps
          skill = eps[0].load()()
          assert skill.manifest.id == "progression"
          assert skill.manifest.version == "0.1.0"
          assert skill.manifest.runtime_api_version == "1"
          PY
      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamerhq-skill-xp-progression-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
